name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify actions lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate OpenAPI schema
        run: npm run generate

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Error: There are uncommitted changes after running 'npm run generate'."
            echo "This indicates that the generated schema is not in sync with the source code."
            echo "Please run 'npm run generate' locally and commit the updated files."
            echo ""
            echo "Changed files:"
            git diff --name-only
            exit 1
          fi

      - name: Validate OpenAPI schema
        run: npm run validate
        env:
          REDOCLY_TELEMETRY: 'off'

      - name: Run tests
        run: npm test

  ci-required:
    if: ${{ !cancelled() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
