name: Generate API docs and deploy to GitHub Pages

on:
  # Automatically trigger when push to main branch
  push:
    branches: ['main']
  # Enable running workflow manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-api-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://abraham.github.io/mastodon-openapi/
    concurrency:
      group: deploy-github-pages
      cancel-in-progress: false
    steps:
      - name: Generate API docs and deploy to GitHub Pages
        uses: msayson/openapi-github-pages-action@v2.0.0
        with:
          api-configs: |-
            [
              {
                "openapi-json-filepath": "dist/schema.json",
                "api-doc-filepath": "index.html"
              }
            ]
          api-docs-dir: docs
